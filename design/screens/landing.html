<!-- @dsCard group="Screens" -->
<!--
  MicroManus — Landing (Phase 1)
  Decision refs: D-01 (minimal utilitarian), warm & approachable / light-first.
  Minimal: wordmark + one-line tagline + GitHub/Google OAuth buttons.
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MicroManus — Sign in</title>
<style>
  :root{
    --bg:#FBF9F6; --surface:#FFFFFF; --surface-2:#F4F1EC;
    --border:#E9E4DB; --border-strong:#DDD6CA;
    --text:#211D18; --text-2:#6C6459; --text-3:#9C9385;
    --accent:#C2410C; --accent-hover:#9A3210; --accent-soft:#FBEAE0;
    --success:#3B7A4B; --error:#B4302A;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --radius:12px; --radius-sm:8px; --radius-lg:18px;
    --shadow:0 4px 16px rgba(60,45,30,.08);
    --shadow-lg:0 18px 50px rgba(60,45,30,.13);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--sans); color:var(--text);
    background:
      radial-gradient(1100px 520px at 50% -10%, #FDF2EA 0%, rgba(253,242,234,0) 60%),
      var(--bg);
    min-height:100vh; display:grid; place-items:center; padding:32px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:400px; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg); padding:40px 36px;
  }
  .brand{display:flex; align-items:center; gap:11px; margin-bottom:26px}
  .mark{
    width:38px; height:38px; border-radius:11px; flex:0 0 auto;
    background:linear-gradient(150deg,var(--accent),#E0742E);
    display:grid; place-items:center; color:#fff; font-weight:700;
    box-shadow:0 4px 12px rgba(194,65,12,.28); position:relative;
  }
  .mark svg{width:21px;height:21px}
  .wordmark{font-size:19px; font-weight:650; letter-spacing:-.02em}
  h1{font-size:23px; line-height:1.25; letter-spacing:-.02em; margin:0 0 9px}
  .tagline{font-size:14.5px; line-height:1.55; color:var(--text-2); margin:0 0 28px}
  .btns{display:flex; flex-direction:column; gap:11px}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    height:46px; border-radius:var(--radius); border:1px solid var(--border-strong);
    background:var(--surface); color:var(--text); font-family:inherit;
    font-size:14.5px; font-weight:550; cursor:pointer; width:100%;
    transition:background .15s,border-color .15s,transform .04s;
  }
  .btn:hover{background:var(--surface-2); border-color:#CFC7B9}
  .btn:active{transform:translateY(1px)}
  .btn svg{width:18px;height:18px;flex:0 0 auto}
  .divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--text-3);font-size:12px}
  .divider::before,.divider::after{content:"";height:1px;background:var(--border);flex:1}
  .foot{
    margin-top:26px; padding-top:18px; border-top:1px solid var(--border);
    display:flex; gap:14px; flex-wrap:wrap; color:var(--text-3); font-size:12.5px;
  }
  .foot b{color:var(--text-2); font-weight:600}
  .foot .dot{color:var(--border-strong)}
  code{font-family:var(--mono); font-size:12px; color:var(--accent);
    background:var(--accent-soft); padding:1px 6px; border-radius:5px}
</style>

<div class="card">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path>
      </svg>
    </span>
    <span class="wordmark">MicroManus</span>
  </div>

  <h1>Research that shows its work.</h1>
  <p class="tagline">A deep-research agent that browses the web, cites every source, and tells you exactly what each answer cost — on your own API key.</p>

  <div class="btns">
    <button class="btn">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.7.5.6 5.6.6 11.9c0 5 3.3 9.3 7.8 10.8.6.1.8-.2.8-.5v-2c-3.2.7-3.9-1.400-3.9-1.4-.5-1.3-1.3-1.700-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.500.1-3.1 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.500-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.200v3.3c0 .3.2.7.8.5 4.5-1.5 7.8-5.8 7.8-10.8C23.4 5.6 18.3.5 12 .5Z"/></svg>
      Continue with GitHub
    </button>
    <button class="btn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.4-1.6 4.1-5.5 4.1-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.9 1.5l2.6-2.5C17.3 3.4 14.9 2.4 12 2.4 6.9 2.4 2.8 6.5 2.8 11.6S6.9 20.8 12 20.8c5.3 0 8.8-3.7 8.8-8.9 0-.6-.1-1.1-.2-1.6H12Z"/><path fill="#34A853" d="M12 20.8c2.4 0 4.5-.8 5.9-2.2l-2.8-2.2c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.2-3.8l-2.9 2.2C5.2 18.8 8.3 20.8 12 20.8Z"/><path fill="#4A90D9" d="M20.8 11.9c0-.6-.1-1.1-.2-1.6H12v3.9h5.5c-.3 1.2-1 2.1-1.9 2.7l2.8 2.2c1.6-1.5 2.6-3.8 2.6-7.2Z"/><path fill="#FBBC05" d="M6.8 13.5A5.5 5.5 0 0 1 6.5 12c0-.5.1-1 .3-1.5L3.9 8.3A9.2 9.2 0 0 0 2.8 12c0 1.4.3 2.6.9 3.7l3.1-2.2Z"/></svg>
      Continue with Google
    </button>
  </div>

  <div class="foot">
    <span><b>BYOK</b> — your key, encrypted</span>
    <span class="dot">·</span>
    <span><code>1 credit</code> = 1 research run</span>
  </div>
</div>
